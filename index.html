<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>GAME PORTAL</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">MY GAME LIBRARY</p>
        <h1>GAME PORTAL</h1>
      </div>
      <nav aria-label="アカウント"><a href="login/">ログイン</a> · <a href="account/">アカウント</a> · <a href="upload/">投稿</a> · <a href="admin/">管理</a></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="hero-kicker">PLAY YOUR GAMES</p>
        <h2>作ったゲームを、ここからすぐ遊べる。</h2>
        <p class="hero-text">
          GodotやScratchで作ったゲームを、ひとつのページにまとめて起動できます。
        </p>
      </div>
    </section>

    <section class="toolbar" aria-label="ゲーム絞り込み">
      <div class="filters" id="filters">
        <button class="filter-button active" data-filter="all">すべて</button>
        <button class="filter-button" data-filter="godot">Godot</button>
        <button class="filter-button" data-filter="scratch">Scratch</button>
      </div>
      <label class="search-box">
        <span>検索</span>
        <input id="searchInput" type="search" placeholder="ゲーム名を検索" />
      </label>
    </section>

    <section>
      <div class="section-heading">
        <h3>ゲーム一覧</h3>
        <span id="gameCount"></span>
      </div>
      <div id="gameGrid" class="game-grid" aria-live="polite"></div>
      <p id="emptyMessage" class="empty-message" hidden>該当するゲームがありません。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>GAME PORTAL / Godot + Scratch</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
