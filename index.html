<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>GAME PORTAL</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/design.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">MY GAME LIBRARY</p>
        <h1><a href="./" aria-label="GAME PORTAL ホーム">GAME PORTAL</a></h1>
      </div>
      <nav class="site-nav" aria-label="メインメニュー"><a href="./" aria-current="page">ホーム</a><a href="login/" data-portal-login>ログイン</a><a href="account/" data-portal-account hidden>アカウント</a><a href="upload/">ゲームを投稿</a><a href="admin/" data-portal-admin hidden>管理画面</a></nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="hero-kicker">DISCOVER & PLAY</p>
        <h2>あなたの次の<br>お気に入りを。</h2>
        <p class="hero-text">
          みんなが作ったゲームを探して、そのまま遊ぼう。あなたの作品もここから投稿できます。
        </p>
        <div class="hero-actions"><a class="hero-primary" href="#games">ゲームを探す <span aria-hidden="true">↗</span></a><a class="hero-secondary" href="upload/">作品を投稿する</a></div>
      </div>
    </section>

    <section class="toolbar" aria-label="ゲーム絞り込み" id="games">
      <div class="filters" id="filters">
        <button class="filter-button active" data-filter="all" aria-pressed="true">すべて</button>
        <button class="filter-button" data-filter="godot" aria-pressed="false">Godot</button>
        <button class="filter-button" data-filter="scratch" aria-pressed="false">Scratch</button>
      </div>
      <label class="search-box">
        <span>検索</span>
        <input id="searchInput" type="search" placeholder="ゲーム名を検索" />
      </label>
    </section>

    <section>
      <div class="section-heading">
        <h3>公開中のゲーム</h3>
        <span id="gameCount"></span>
      </div>
      <div id="gameGrid" class="game-grid" aria-live="polite"></div>
      <p id="emptyMessage" class="empty-message" hidden>該当するゲームがありません。</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>GAME PORTAL / Godot + Scratch</p>
  </footer>

  <script type="module" src="assets/navigation.js?v=20261003a"></script>
  <script type="module" src="assets/app.js?v=20260930a"></script>
</body>
</html>
