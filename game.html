<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>GAME PORTAL</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="play-page">
  <header class="play-header">
    <a href="index.html" class="back-link">← ゲーム一覧</a>
    <div class="play-actions">
      <button id="fullscreenButton" class="action-button">全画面</button>
    </div>
  </header>

  <main class="play-container">
    <section class="game-info">
      <div>
        <p id="engineLabel" class="engine-label"></p>
        <h1 id="gameTitle">Loading...</h1>
        <p id="gameDescription"></p>
      </div>
    </section>

    <section class="player-shell" id="playerShell">
      <div id="loading" class="player-loading">ゲームを読み込んでいます…</div>
      <iframe
        id="gameFrame"
        title="Game"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen
      ></iframe>
    </section>

    <section class="game-meta">
      <div class="meta-card">
        <h2>操作方法</h2>
        <p id="controlsText">—</p>
      </div>
      <div class="meta-card">
        <h2>バージョン</h2>
        <p id="versionText">—</p>
      </div>
    </section>
  </main>

  <script src="assets/play.js"></script>
</body>
</html>
