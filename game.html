<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>GAME PORTAL</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="play-page">
  <header class="site-header">
    <div class="header-inner">
      <div><p class="eyebrow">MY GAME LIBRARY</p><h1><a href="./" aria-label="GAME PORTAL ホーム">GAME PORTAL</a></h1></div>
      <nav aria-label="アカウント"><a href="login/" data-portal-login>ログイン</a> · <a href="account/" data-portal-account hidden>アカウント</a> · <a href="upload/">投稿</a> · <a href="admin/">管理</a></nav>
    </div>
  </header>

  <main class="play-container">
    <section class="game-info">
      <button id="fullscreenButton" class="action-button">全画面</button>
      <div>
        <p id="engineLabel" class="engine-label"></p>
        <h1 id="gameTitle">Loading...</h1>
        <p id="gameDescription"></p>
      </div>
    </section>

    <section class="player-shell" id="playerShell">
      <div id="loading" class="player-loading">ゲームを読み込んでいます…</div>
      <iframe
        id="gameFrame"
        title="Game"
        allow="autoplay; fullscreen; gamepad"
        allowfullscreen
      ></iframe>
    </section>

    <section class="game-meta">
      <div class="meta-card">
        <h2>操作方法</h2>
        <p id="controlsText">—</p>
      </div>
      <div class="meta-card">
        <h2>バージョン</h2>
        <p id="versionText">—</p>
      </div>
    </section>
  </main>

  <script type="module" src="assets/navigation.js"></script>
  <script src="assets/play.js"></script>
</body>
</html>
