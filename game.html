<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>GAME PORTAL</title>
  <link rel="stylesheet" href="assets/style.css?v=20261010f" />
  <link rel="stylesheet" href="assets/design.css?v=20261009a" />
  <link rel="stylesheet" href="./assets/support.css?v=20261009d">
  <link rel="stylesheet" href="assets/theme.css?v=20261007b">
  <script src="assets/theme.js?v=20261007b"></script>
<link rel="stylesheet" href="./assets/consent.css?v=20261010d">
<link rel="stylesheet" href="assets/library.css?v=20261010c"></head>
<body class="play-page">
  <header class="site-header">
    <div class="header-inner">
      <div><p class="eyebrow">MY GAME LIBRARY</p><h1><a href="./" aria-label="GAME PORTAL ホーム">GAME PORTAL</a></h1></div>
      <nav class="site-nav" aria-label="メインメニュー"><a href="./">ホーム</a><a href="login/" data-portal-login>ログイン</a><a href="account/" data-portal-account hidden>アカウント</a><a href="library/" data-portal-library hidden>ライブラリ</a><a href="upload/">ゲームを投稿</a><a href="admin/" data-portal-admin hidden>管理画面</a></nav>
    </div>
  </header>

  <main class="play-container">
    <a class="game-back" href="./#games">← ゲーム一覧</a>
    <div id="playConsent"></div>
    <div id="playContent" data-consent-content hidden>
    <section class="game-info">
      <div>
        <div class="game-tags"><span id="engineLabel" class="engine-label" hidden></span><span id="versionText" class="game-version" hidden></span></div>
        <h1 id="gameTitle">ゲームを読み込んでいます</h1>
      </div>
      <button id="shareButton" class="action-button" disabled>URLをコピー</button>
    </section>

    <section class="player-shell" id="playerShell" aria-label="ゲームプレイヤー" aria-busy="true">
      <div class="player-toolbar">
        <span id="playerStatus" class="player-status" role="status">読込中</span>
        <div class="player-actions">
          <button id="reloadButton" class="action-button" title="ゲームを再読み込み" disabled>再読み込み</button>
          <button id="fullscreenButton" class="action-button" aria-pressed="false" disabled>全画面で遊ぶ</button>
        </div>
      </div>
      <div class="player-viewport">
        <div id="loading" class="player-loading" role="status">ゲームを読み込んでいます…</div>
        <iframe id="gameFrame" title="ゲーム" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
      </div>
    </section>

    <section class="game-meta">
      <div class="meta-card" id="descriptionCard" hidden>
        <h2>このゲームについて</h2>
        <p id="gameDescription"></p>
      </div>
      <div class="meta-card">
        <h2>操作方法</h2>
        <p id="controlsText">ゲーム内の案内をご確認ください。</p>
      </div>
      <div class="meta-card" id="creditsCard" hidden>
        <h2>素材の権利表記・提供元</h2>
        <p id="gameCredits" class="game-credits"></p>
      </div>
      <div class="meta-card" id="aiCard" hidden><h2>AIの利用</h2><p id="gameAI"></p></div>
    </section>
  </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><div><a class="footer-brand" href="./">GAME PORTAL</a><p>遊ぶ人とつくる人が集まる場所。</p></div><nav aria-label="サポート・ポリシー"><a href="./faq/">FAQ</a><a href="./terms/">利用規約</a><a href="./privacy/">プライバシーポリシー</a><a href="./rights/">権利表記</a></nav></div><p class="footer-disclaimer">本サービスはGodot Foundation、Scratch FoundationおよびTurboWarpの公式サービスではなく、各団体との提携・承認関係はありません。</p></footer>

  <script type="module" src="assets/navigation.js?v=20261009b"></script>
  <script type="module" src="assets/play.js?v=20261010f"></script>
</body>
</html>
